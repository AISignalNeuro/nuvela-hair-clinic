<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1b2b" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <title>Nuvela Hair Clinic Istanbul | Hair, Beard &amp; Eyebrow Transplant in Turkey</title>
    <meta
      name="description"
      content="Doctor-led Sapphire FUE, DHI, beard and eyebrow transplants in Istanbul with all-inclusive packages, VIP transfers and 12-month aftercare."
    />
    <meta property="og:site_name" content="Nuvela Hair Clinic" />
    <meta property="og:image" content="%BASE_URL%og-image.png" />
    <script>
      // Set lang/dir before first paint so Arabic pages never flash left-to-right.
      (function () {
        var base = "%BASE_URL%";
        var path = location.pathname.indexOf(base) === 0 ? location.pathname.slice(base.length) : location.pathname;
        var lang = path.replace(/^\//, "").split("/")[0];
        if (["en", "tr", "ar"].indexOf(lang) !== -1) {
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Please enable JavaScript to view the Nuvela Hair Clinic website.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
