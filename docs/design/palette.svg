<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="'Plus Jakarta Sans', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E8A8F"/>
      <stop offset="0.55" stop-color="#2BB3A8"/>
      <stop offset="1" stop-color="#D9B26A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2C27F"/>
      <stop offset="0.5" stop-color="#C9A15A"/>
      <stop offset="1" stop-color="#A9823D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0" r="0.9">
      <stop offset="0" stop-color="#2BB3A8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2BB3A8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="520" rx="28" fill="#0B1B2B"/>
  <rect width="1200" height="520" rx="28" fill="url(#glow)"/>

  <text x="56" y="70" fill="#7FD6CF" font-size="14" font-weight="800" letter-spacing="3">DESIGN SYSTEM</text>
  <text x="56" y="112" fill="#FFFFFF" font-size="36" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-weight="600">Istanbul turquoise &amp; gold</text>

  <!-- swatches -->
  <g font-size="13">
    <g transform="translate(56 150)">
      <rect width="120" height="120" rx="18" fill="#0B1B2B" stroke="#ffffff" stroke-opacity="0.25"/>
      <text y="146" fill="#FFFFFF" font-weight="700">Ink</text>
      <text y="166" fill="#9FB3C4">#0B1B2B</text>
    </g>
    <g transform="translate(196 150)">
      <rect width="120" height="120" rx="18" fill="#183A55"/>
      <text y="146" fill="#FFFFFF" font-weight="700">Deep sea</text>
      <text y="166" fill="#9FB3C4">#183A55</text>
    </g>
    <g transform="translate(336 150)">
      <rect width="120" height="120" rx="18" fill="#0E8A8F"/>
      <text y="146" fill="#FFFFFF" font-weight="700">Turquoise</text>
      <text y="166" fill="#9FB3C4">#0E8A8F</text>
    </g>
    <g transform="translate(476 150)">
      <rect width="120" height="120" rx="18" fill="#7FD6CF"/>
      <text y="146" fill="#FFFFFF" font-weight="700">Aqua</text>
      <text y="166" fill="#9FB3C4">#7FD6CF</text>
    </g>
    <g transform="translate(616 150)">
      <rect width="120" height="120" rx="18" fill="url(#gold)"/>
      <text y="146" fill="#FFFFFF" font-weight="700">Gold</text>
      <text y="166" fill="#9FB3C4">#C9A15A</text>
    </g>
    <g transform="translate(756 150)">
      <rect width="120" height="120" rx="18" fill="#F6F0E7"/>
      <text y="146" fill="#FFFFFF" font-weight="700">Sand</text>
      <text y="166" fill="#9FB3C4">#F6F0E7</text>
    </g>
    <g transform="translate(896 150)">
      <rect width="120" height="120" rx="18" fill="#FBFAF7"/>
      <text y="146" fill="#FFFFFF" font-weight="700">Paper</text>
      <text y="166" fill="#9FB3C4">#FBFAF7</text>
    </g>
    <g transform="translate(1036 150)">
      <rect width="108" height="120" rx="18" fill="#1FB855"/>
      <text y="146" fill="#FFFFFF" font-weight="700">WhatsApp</text>
      <text y="166" fill="#9FB3C4">#1FB855</text>
    </g>
  </g>

  <!-- brand gradient -->
  <rect x="56" y="350" width="560" height="16" rx="8" fill="url(#brand)"/>
  <text x="56" y="392" fill="#9FB3C4" font-size="13">Brand gradient · used on icons, progress and highlights</text>

  <!-- type scale -->
  <text x="56" y="452" fill="#FFFFFF" font-size="30" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-weight="600">Aa  Fraunces</text>
  <text x="300" y="452" fill="#FFFFFF" font-size="24" font-weight="700">Aa  Plus Jakarta Sans</text>
  <text x="620" y="452" fill="#FFFFFF" font-size="24" font-weight="700" font-family="'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif">أب  IBM Plex Sans Arabic</text>
  <text x="56" y="482" fill="#9FB3C4" font-size="13">Display headings</text>
  <text x="300" y="482" fill="#9FB3C4" font-size="13">Body &amp; interface (Latin, Turkish)</text>
  <text x="620" y="482" fill="#9FB3C4" font-size="13">Arabic headings &amp; body (RTL)</text>

  <!-- radius / elevation chips -->
  <g transform="translate(700 336)">
    <rect width="96" height="48" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="48" y="30" fill="#FFFFFF" font-size="13" text-anchor="middle">12px</text>
    <rect x="112" width="96" height="48" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="160" y="30" fill="#FFFFFF" font-size="13" text-anchor="middle">18px</text>
    <rect x="224" width="96" height="48" rx="26" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="272" y="30" fill="#FFFFFF" font-size="13" text-anchor="middle">26px</text>
    <rect x="336" width="108" height="48" rx="24" fill="url(#gold)"/>
    <text x="390" y="30" fill="#1B1408" font-size="13" font-weight="700" text-anchor="middle">Pill CTA</text>
  </g>
  <text x="700" y="410" fill="#9FB3C4" font-size="13">Corner radius scale &amp; primary call to action</text>
</svg>
