# Local full stack: PostgreSQL + API.  docker compose up --build
# Then seed once:  docker compose exec api npm run db:seed
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nuvela
      POSTGRES_PASSWORD: nuvela
      POSTGRES_DB: nuvela
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuvela"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      PUBLIC_URL: http://localhost:4000
      DATABASE_URL: postgresql://nuvela:nuvela@db:5432/nuvela?schema=public
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-please-change-this-access-secret}
      OTP_SECRET: ${OTP_SECRET:-please-change-this-otp-secret}
      OTP_DEV_ECHO: "true"
    ports: ["4000:4000"]
    volumes: [uploads:/app/backend/uploads]

volumes:
  db-data:
  uploads:
